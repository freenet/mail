name: Check Published Contract Drift

on:
  # No path filter on pull_request (issue #339): `check-drift` is a
  # required status check, and a path-filtered workflow never reports
  # it on a PR outside these paths, which leaves that PR unmergeable.
  # Instead the `changes` job lets `check-drift` skip only a PR that
  # changes nothing but documentation. A job skipped by its `if:`
  # reports success to required checks.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'contracts/web-container/**'
      - 'contracts/facade/**'
      - 'contracts/facade-types/**'
      - 'contracts/facade-loader/**'
      - 'common/**'
      - 'ui/**'
      - 'published-contract/**'
      - 'test-contract/web-container-keys.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'modules/**'
      - 'contracts/inbox/**'
      - 'scripts/**'
      - 'Makefile.toml'
      - 'legacy_*.toml'
      - '.githooks/**'
      - '.github/workflows/check-contract-wasm.yml'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull_request checkout is the merge commit, so HEAD^1 is
          # the base branch and `HEAD^1 HEAD` is exactly the PR's diff.
          fetch-depth: 2

      - name: Detect drift-relevant changes
        id: filter
        run: |
          # An allowlist of what is safe to skip, not a list of what
          # matters: many inputs move container.wasm bytes (.cargo/config.toml
          # rustflags, Makefile.toml, scripts/), and a missed one must run
          # the gate, not skip it. No Markdown file feeds the build, except
          # under ui/public/ (Dioxus asset_dir, shipped in the webapp).
          # --no-renames so a rename lists its source path too.
          relevant=true
          if [ "${{ github.event_name }}" = "pull_request" ] \
            && changed=$(git diff --no-renames --name-only HEAD^1 HEAD) \
            && ! printf '%s\n' "$changed" | grep -qE '^ui/public/' \
            && ! printf '%s\n' "$changed" \
              | grep -qvE '(\.md$|^(LICENSE|COPYING)(\.(LESSER|txt|md))?$|^$)'; then
            relevant=false
            echo "Only documentation changed; check-drift will be skipped."
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  check-drift:
    needs: changes
    # Run unless `changes` positively said "docs only". If `changes`
    # failed or was cancelled, its output is empty and the gate runs:
    # a skipped required check would otherwise pass (fail-open).
    # `!cancelled()` rather than `always()`: still runs when `changes`
    # failed, but not on a run that was cancelled outright.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    # ubicloud-standard-8: the container contract byte-equality step
    # below is a full wasm32 release compile.
    runs-on: ubicloud-standard-8
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 2

      - name: Install Rust
        # Keep in sync with rust-toolchain.toml.
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown

      - name: Install the container contract's pinned Rust
        # Issue #206: container.wasm bytes, and so the container contract
        # id, depend on the rustc version. contracts/facade/rust-toolchain.toml
        # pins it; rustup reads that file here and in every container build.
        working-directory: contracts/facade
        run: rustup toolchain install

      - name: Cache cargo-installed binaries
        id: cache-bins
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/fdev
          key: ${{ runner.os }}-cargo-bins-fdev-0.3.313-v4

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install fdev
        if: steps.cache-bins.outputs.cache-hit != 'true'
        # The prebuilt fdev from the matching freenet-core release
        # (v0.2.151 ships fdev 0.3.313).
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl -fsSL "https://github.com/freenet/freenet-core/releases/download/v0.2.151/fdev-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin/" fdev
          chmod +x "$HOME/.cargo/bin/fdev"
          fdev --version

      # Issue #214 F1 tripwire. The committed parameters MUST be the
      # production verifying key, never the committed test key from
      # test-contract/web-container-keys.toml (#241).
      - name: Verify webapp.parameters matches production pubkey
        run: |
          EXPECTED="31dd371fedc842994c6e571a0868e5eece1367a7d8cc16c498a57c985526ae46"
          ACTUAL=$(xxd -p -c 64 published-contract/webapp.parameters | tr -d '\n')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::webapp.parameters does not match the production verifying key."
              echo "  expected: $EXPECTED"
              echo "  actual:   $ACTUAL"
              echo ""
              echo "Only the production snapshot is committed. Restore it with"
              echo "git checkout -- published-contract/."
              exit 1
          fi
          echo "✅ webapp.parameters matches the committed production pubkey."

      # The webapp contract, and the contract and delegate WASM the UI
      # embeds, are frozen: their bytes are the keys users' data and URLs
      # live under. Checks the byte pins, each WASM's code hash, and the
      # derived webapp and container contract ids. This replaces the old
      # informational rebuild-and-diff, which could never match: a rebuild
      # embeds the build machine's paths.
      - name: Verify frozen artifacts
        run: bash scripts/check-frozen-artifacts.sh

      # The check above only proves the tree is self-consistent: rewriting a
      # WASM, its code hash and its pin together passes it. This one proves
      # nothing frozen changed. HEAD^1 is the base branch on a pull_request
      # run (the checkout is the merge commit) and the previous main commit
      # on a push; fetch-depth: 2 above makes it available.
      - name: Verify no frozen artifact changed
        run: bash scripts/check-frozen-immutable.sh HEAD^1

      # Nothing else compiles the contract and delegate sources for wasm32
      # now that the shipped bytes are frozen. Build each the way a new
      # generation would be built, so the sources, scripts/build-wasm.sh and
      # scripts/check-wasm-paths.sh keep working. The output is discarded.
      - name: Build contract and delegate WASM reproducibly
        run: bash scripts/check-wasm-builds.sh

      # Issue #206 (closes the Phase 1 informational gate). The container
      # contract id is intended to stay byte-stable across releases.
      # Both prerequisites are now in place:
      #   • rustc pinned in contracts/facade/rust-toolchain.toml.
      #   • Snapshot at published-contract/container{.wasm,.parameters,-id.txt}
      #     produced under linux/amd64 with that pinned rustc.
      # Any drift in the rebuilt wasm is now a release blocker —
      # the rebuild MUST match the committed snapshot byte-for-byte.
      - name: Verify container wasm byte-equality (issue #206)
        id: facade-verify
        run: |
          if [ ! -f published-contract/container.wasm ]; then
            echo "::error::published-contract/container.wasm missing."
            echo "Bootstrap the snapshot via scripts/build-container-snapshot-linux.sh"
            echo "and commit published-contract/container{.wasm,.parameters,-id.txt}."
            exit 1
          fi
          bash scripts/check-container-byte-equal.sh

      # Bootstrap helper (#206): on drift, upload the freshly-built
      # container.wasm so an operator can download it, recompute the
      # contract id, and commit the canonical CI-built snapshot. Local
      # docker amd64 emulation (qemu) produces different bytes from
      # native ubicloud amd64 — only CI bytes are canonical.
      - name: Upload rebuilt container.wasm on drift
        if: failure() && steps.facade-verify.conclusion == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: facade-wasm-rebuilt-${{ github.sha }}
          path: contracts/facade/target/wasm32-unknown-unknown/release/freenet_email_facade.wasm
          if-no-files-found: warn
          retention-days: 7

      # Issue #214 F1: container.parameters IS the production verifying
      # key (32 bytes ed25519). The committed container contract id is
      # `hash(container.wasm, container.parameters)`, so swapping the
      # parameters silently rotates the stable bookmarkable URL —
      # exactly the failure #200 was designed to prevent. Hard-code
      # the production pubkey here as a tripwire: a PR that touches
      # published-contract/container.parameters MUST update this hex,
      # which is a visible, reviewable change.
      #
      # Production pubkey is the ed25519 verifying key under
      # ~/.config/freenet-email/web-container-keys.toml. Rotating the
      # production key requires bumping this constant in the same PR.
      - name: Verify container.parameters matches production pubkey
        run: |
          EXPECTED="31dd371fedc842994c6e571a0868e5eece1367a7d8cc16c498a57c985526ae46"
          ACTUAL=$(xxd -p -c 64 published-contract/container.parameters | tr -d '\n')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::container.parameters does not match the production verifying key."
              echo "  expected: $EXPECTED"
              echo "  actual:   $ACTUAL"
              echo ""
              echo "This means either:"
              echo "  (a) the snapshot was signed with the test key by mistake, or"
              echo "  (b) the production key was rotated — bump EXPECTED in"
              echo "      .github/workflows/check-contract-wasm.yml in the same PR."
              exit 1
          fi
          echo "✅ container.parameters matches the committed production pubkey."

