# Legacy identity-management delegate registry.
#
# Every PREVIOUS identity-management delegate, so a migration can read
# identities stored under an older delegate key (a delegate's secrets belong to
# its key; a new key starts empty). The currently shipped delegate is NOT
# listed: its hash comes from the committed artifact
# (published-contract/wasm/v1/identity_management_code_hash), and
# ui/src/legacy_registry.rs refuses a registry that contains it.
#
# Format: freenet-migrate-build's unified schema. `code_hash` is blake3 of the
# delegate WASM (base58); `delegate_key` is blake3(code_hash ‖ params), which
# the build re-derives from `params_hex` and checks. The params are the
# serialized key derived from the COMMITTED test key in
# test-contract/identity/ (not a user secret; delegate parameters are public to
# the node). `generation` = major*10000 + minor*100 + patch of the release.
#
# Append-only. Removing or editing a row strands any user still on that
# generation.

[[delegate]]
generation = 205
code_hash = "2gFVM7AznH6gtMi2onvtKS2fosg3QFTnJSNNTYrHsrSV"
delegate_key = "6ce4197510093e1f6e035dd077830a1cc0b9772cbfc1559ffa6c0012c15359bd"
params_hex = "7b227365637265745f6b6579223a22353941453530393031363343373039344646453131464143343846354144423730353332433134343538393533394435373034343645423246333943414333313838454146323530384443363831393437453444304543314235463741343139227d"
note = "identity-management as embedded in the live v0.2.5 webapp (#348)"
