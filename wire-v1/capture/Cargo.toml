[package]
name = "wire-v1-capture"
version = "0.0.0"
edition = "2024"
license = "LGPL-3.0-or-later"
publish = false
description = "Captures the v0.2.x golden wire bytes through the frozen crates"

# Outside the workspace with its own Cargo.lock: it links the frozen crates,
# which pin freenet-stdlib 0.3.5, and the crypto crates every v0.2.x client
# shipped with. See src/main.rs for the commands.
[workspace]

[dependencies]
bincode = "=1.3.3"
chrono = { version = "=0.4.44", default-features = false, features = ["alloc", "serde"] }
freenet-aft-interface = { path = "../../modules/antiflood-tokens/interfaces" }
freenet-email-inbox = { path = "../../contracts/inbox" }
freenet-stdlib = "=0.3.5"
hkdf = "=0.12.4"
identity-management = { path = "../../modules/identity-management" }
mail-local-state = { path = "../../modules/mail-local-state" }
ml-dsa = { version = "=0.1.0-rc.8", default-features = false, features = ["alloc", "rand_core"] }
ml-kem = { version = "=0.3.0-rc.2", default-features = false }
rand_core = "=0.10.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = { version = "=0.10.9", default-features = false }
