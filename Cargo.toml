[workspace]
resolver = "2"
members = [
    # Members: shared types (common), the client's copy of the v0.2.x wire
    # types (wire-v1), the UI, and dev tools. Nothing published is built
    # from here: the WASM of every contract and delegate is frozen under
    # published-contract/, because a delegate's key (and so every secret it
    # stores) and a contract's id both derive from the WASM bytes. A rebuild
    # is never harmless; a new generation needs a migration registry row
    # (legacy_*.toml) and a new published-contract/wasm/v<N>/.
    "common",
    "ui",
    "wire-v1",
    "tools/web-container-sign",
]
# Issues #198 + #199: every on-chain contract and delegate (and the shared
# types crates they depend on) lives outside the workspace with its own
# Cargo.lock, so workspace dep bumps cannot reach these build graphs.
# That alone does not make a rebuild reproducible (embedded build paths
# differ per machine, #348), so the shipped bytes are frozen under
# published-contract/ and never rebuilt for a release.
#
# Each excluded crate has =x.y.z pins on every dep that influences wasm
# output (ml-dsa, chrono, freenet-stdlib, ed25519-dalek, etc.).
# Deliberately bumping any of those is the only way to rotate the
# corresponding contract id, and must be paired with the appropriate
# migration story (issue #199 Phase B).
exclude = [
    "contracts/facade",
    "contracts/facade-types",
    # facade-loader/ is data-only (HTML), but listing it keeps cargo from
    # complaining about the missing Cargo.toml when it walks the tree.
    "contracts/facade-loader",
    "contracts/inbox",
    "contracts/web-container",
    "modules/antiflood-tokens/interfaces",
    "modules/antiflood-tokens/contracts/token-allocation-record",
    "modules/antiflood-tokens/delegates/token-generator",
    "modules/identity-management",
    "modules/mail-local-state",
    # Links the frozen crates to capture wire-v1's golden fixtures.
    "wire-v1/capture",
]

[workspace.package]
version = "0.2.7"
edition = "2024"
license = "LGPL-3.0-or-later"

[workspace.dependencies]
# Freenet
freenet-stdlib = "0.12.1"
# Internal
freenet-email-core = { path = "common" }
freenet-mail-wire-v1 = { path = "wire-v1" }
# Shared
# Stays on bincode 1: the frozen token-generator delegate speaks bincode 1's
# encoding, which bincode 2 and later changed.
bincode = "3.0.0"
bs58 = "0.5.1"
# default-features = false keeps `clock` (and its js-sys/wasm-bindgen
# pull-in) out of anything that does not ask for it. Opt back into
# `clock`/`wasmbind` at the consumer level (e.g. UI) when needed.
chrono = { version = "0.4.45", default-features = false, features = ["alloc", "serde"] }
# ML-DSA-65 (FIPS 204) and ML-KEM-768 (FIPS 203). Every v0.2.x identity was
# created with ml-dsa 0.1.0-rc.8 and ml-kem 0.3.0-rc.2; the known-answer
# vectors in ui/src/inbox/crypto_vectors.rs pin that these releases derive
# the same keys, sign the same bytes, and decrypt old messages.
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc"] }
ml-kem = { version = "0.3.3", default-features = false }
getrandom = { version = "0.4.3", features = ["sys_rng"] }
hkdf = "0.13.0"
sha2 = { version = "0.11.1", default-features = false }
serde = "1.0.229"
serde_json = "1.0.154"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
wasm-bindgen = "0.2.129"
dioxus = "0.7.10"
# Web-container signer
ciborium = "0.2.2"
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["alloc", "serde"] }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
strip = true
panic = "abort"

# dx builds the web UI with this profile. Under rustc 1.99's LLVM,
# `strip = true` removes every custom section, including the one wasm-bindgen
# reads, so the UI strips debug info only; wasm-opt strips the rest after
# wasm-bindgen has run.
[profile.wasm-release]
inherits = "release"
strip = "debuginfo"
