[package]
name = "v1-node-seed"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Put a v0.2.7 user's data on a test node, through the frozen delegates"

[[bin]]
name = "v1-node-seed"
path = "src/main.rs"

[dependencies]
freenet-mail-wire-v1 = { workspace = true }
freenet-stdlib = { workspace = true, features = ["net"] }
serde_json = { workspace = true }
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }
# The version freenet-stdlib's `WebApi::start` takes its connection from.
tokio-tungstenite = "0.27.0"
