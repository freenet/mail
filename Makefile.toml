[config]
skip_core_tasks = true
default_to_workspace = false

[env]
CONTRACT_TARGET = "wasm32-unknown-unknown"
BUILD_PROFILE = "release"
# Note: fdev's `get_workspace_target_dir()` walks up from its compile-time
# CARGO_MANIFEST_DIR looking for a [workspace] Cargo.toml and panics with
# "Could not find workspace root" when fdev was installed from a different
# tree that no longer exists. Each build task below sets CARGO_TARGET_DIR
# explicitly to bypass that walk.

[tasks.clean]
description = "Clean build artifacts"
command = "cargo"
args = ["clean"]

# ─── Contract / delegate WASM builds via fdev ─────────────────────────────────
#
# These rebuild contract/delegate WASM from source into each crate's build/
# dir. Nothing the UI embeds or publishes comes from them: the shipped bytes
# are frozen under published-contract/wasm/v1/ (see published-contract/README.md),
# because a rebuild embeds build-machine paths and so changes the keys.
# A deliberate new generation is built with scripts/build-wasm.sh, which
# remaps those paths, and committed under a new published-contract/wasm/vN/.

[tasks.build-inbox-contract]
description = "Build the inbox contract WASM + code hash"
script_runner = "bash"
script = '''
set -euo pipefail
# Issue #199: contracts/inbox lives outside the workspace with its own
# Cargo.lock so workspace dep churn cannot rotate the inbox wasm bytes.
# CARGO_TARGET_DIR pinned to the crate-local target/ — bypasses fdev's
# `get_workspace_target_dir()` walk (which would otherwise panic if fdev
# was installed from a different tree). Pointing it at the in-tree target/ is the explicit-override
# pattern fdev expects.
CRATE_DIR="${CARGO_MAKE_WORKING_DIRECTORY}/contracts/inbox"
cd "$CRATE_DIR"
CARGO_TARGET_DIR="$CRATE_DIR/target" fdev build --features contract
# Extract the code hash and write it to <repo>/build/inbox_code_hash. The UI
# does not read it: it embeds published-contract/wasm/v1/inbox_code_hash.
hash=$(CARGO_TARGET_DIR="$CRATE_DIR/target" fdev inspect \
    build/freenet/freenet_email_inbox code | \
    grep 'code hash:' | cut -d' ' -f3)
mkdir -p "${CARGO_MAKE_WORKING_DIRECTORY}/build"
printf '%s' "$hash" > "${CARGO_MAKE_WORKING_DIRECTORY}/build/inbox_code_hash"
echo "wrote build/inbox_code_hash: $hash"
'''

[tasks.build-token-allocation-record]
description = "Build token-allocation-record contract WASM + code hash"
script_runner = "bash"
script = '''
set -euo pipefail
# Issue #199: AFT contracts live outside the workspace (own Cargo.lock).
# CARGO_TARGET_DIR pinned to crate-local target/ — bypasses fdev's
# get_workspace_target_dir() walk (see build-inbox-contract for
# rationale).
CRATE_DIR="${CARGO_MAKE_WORKING_DIRECTORY}/modules/antiflood-tokens/contracts/token-allocation-record"
cd "$CRATE_DIR"
CARGO_TARGET_DIR="$CRATE_DIR/target" fdev build --features freenet-main-contract
hash=$(CARGO_TARGET_DIR="$CRATE_DIR/target" fdev inspect \
    build/freenet/freenet_token_allocation_record code | \
    grep 'code hash:' | cut -d' ' -f3)
mkdir -p build
printf '%s' "$hash" > build/token_allocation_record_code_hash
echo "wrote build/token_allocation_record_code_hash: $hash"
'''

[tasks.build-token-generator]
description = "Build token-generator delegate WASM + code hash"
script_runner = "bash"
script = '''
set -euo pipefail
# Issue #199: AFT delegates live outside the workspace (own Cargo.lock).
CRATE_DIR="${CARGO_MAKE_WORKING_DIRECTORY}/modules/antiflood-tokens/delegates/token-generator"
cd "$CRATE_DIR"
CARGO_TARGET_DIR="$CRATE_DIR/target" fdev build \
    --package-type delegate --features freenet-main-delegate
hash=$(CARGO_TARGET_DIR="$CRATE_DIR/target" fdev inspect \
    build/freenet/freenet_token_generator delegate | \
    grep 'code hash:' | cut -d' ' -f3)
mkdir -p build
printf '%s' "$hash" > build/token_generator_code_hash
echo "wrote build/token_generator_code_hash: $hash"
'''

[tasks.build-identity-management-delegate]
description = "Build identity-management delegate WASM + code hash"
script_runner = "bash"
script = '''
set -euo pipefail
CRATE_DIR="${CARGO_MAKE_WORKING_DIRECTORY}/modules/identity-management"
cd "$CRATE_DIR"
# identity-management needs both `contract` (to pull in freenet-stdlib's
# wasm-compatible memory helpers) and `freenet-main-delegate` (to emit the
# #[delegate] macro's extern "C" FFI wrapper).
CARGO_TARGET_DIR="${CARGO_MAKE_WORKING_DIRECTORY}/target" fdev build \
    --package-type delegate --features freenet-main-delegate,contract
hash=$(CARGO_TARGET_DIR="${CARGO_MAKE_WORKING_DIRECTORY}/target" fdev inspect \
    build/freenet/identity_management delegate | \
    grep 'code hash:' | cut -d' ' -f3)
mkdir -p build
printf '%s' "$hash" > build/identity_management_code_hash
echo "wrote build/identity_management_code_hash: $hash"
'''

[tasks.build-mail-local-state-delegate]
description = "Build mail-local-state delegate WASM + code hash"
script_runner = "bash"
script = '''
set -euo pipefail
CRATE_DIR="${CARGO_MAKE_WORKING_DIRECTORY}/modules/mail-local-state"
cd "$CRATE_DIR"
CARGO_TARGET_DIR="${CARGO_MAKE_WORKING_DIRECTORY}/target" fdev build \
    --package-type delegate --features freenet-main-delegate,contract
hash=$(CARGO_TARGET_DIR="${CARGO_MAKE_WORKING_DIRECTORY}/target" fdev inspect \
    build/freenet/mail_local_state delegate | \
    grep 'code hash:' | cut -d' ' -f3)
mkdir -p build
printf '%s' "$hash" > build/mail_local_state_code_hash
echo "wrote build/mail_local_state_code_hash: $hash"
'''

[tasks.generate-mail-local-state-params]
description = "Generate the test mail-local-state keypair and serialized params"
script_runner = "bash"
script = '''
set -euo pipefail
CRATE_DIR="${CARGO_MAKE_WORKING_DIRECTORY}/modules/mail-local-state"
OUT_DIR="$CRATE_DIR/build"
KEY_DIR="${CARGO_MAKE_WORKING_DIRECTORY}/test-contract/mail-local-state"
mkdir -p "$OUT_DIR" "$KEY_DIR"

if [ -f "$OUT_DIR/mail-local-state-params" ] && \
   [ "$(wc -c < "$OUT_DIR/mail-local-state-params")" -gt 20 ] && \
   ! grep -q PLACEHOLDER "$OUT_DIR/mail-local-state-params" 2>/dev/null; then
    echo "mail-local-state-params already present, skipping generation"
    exit 0
fi

if [ -f "$KEY_DIR/mail-local-state-key.private.pem" ]; then
    echo "reusing existing test key at $KEY_DIR"
    cargo run --quiet --manifest-path "$CRATE_DIR/Cargo.toml" --bin tool -- \
        --path "$OUT_DIR" --key "$KEY_DIR/mail-local-state-key.private.pem"
else
    echo "generating fresh test key at $KEY_DIR"
    cargo run --quiet --manifest-path "$CRATE_DIR/Cargo.toml" --bin tool -- \
        --path "$OUT_DIR"
    mv "$OUT_DIR/mail-local-state-key.private.pem" "$KEY_DIR/"
    mv "$OUT_DIR/mail-local-state-key.public.pem"  "$KEY_DIR/"
fi
echo "wrote $OUT_DIR/mail-local-state-params"
'''

[tasks.generate-identity-params]
description = "Generate the test identity-manager keypair and serialized params"
script_runner = "bash"
script = '''
set -euo pipefail
CRATE_DIR="${CARGO_MAKE_WORKING_DIRECTORY}/modules/identity-management"
OUT_DIR="$CRATE_DIR/build"
KEY_DIR="${CARGO_MAKE_WORKING_DIRECTORY}/test-contract/identity"
mkdir -p "$OUT_DIR" "$KEY_DIR"

# Treat a PLACEHOLDER stub (left over from the monorepo extraction)
# as missing so we regenerate. A real serialized Parameters file is
# ~100 bytes or more.
if [ -f "$OUT_DIR/identity-manager-params" ] && \
   [ "$(wc -c < "$OUT_DIR/identity-manager-params")" -gt 20 ] && \
   ! grep -q PLACEHOLDER "$OUT_DIR/identity-manager-params" 2>/dev/null; then
    echo "identity-manager-params already present, skipping generation"
    exit 0
fi

if [ -f "$KEY_DIR/identity-manager-key.private.pem" ]; then
    echo "reusing existing test key at $KEY_DIR"
    cargo run --quiet --manifest-path "$CRATE_DIR/Cargo.toml" --bin tool -- \
        --path "$OUT_DIR" --key "$KEY_DIR/identity-manager-key.private.pem"
else
    echo "generating fresh test key at $KEY_DIR"
    cargo run --quiet --manifest-path "$CRATE_DIR/Cargo.toml" --bin tool -- \
        --path "$OUT_DIR"
    # Move generated keypair into test-contract/identity so the params
    # file stays in build/ but the keys live next to other test fixtures.
    mv "$OUT_DIR/identity-manager-key.private.pem" "$KEY_DIR/"
    mv "$OUT_DIR/identity-manager-key.public.pem"  "$KEY_DIR/"
fi
echo "wrote $OUT_DIR/identity-manager-params"
'''

[tasks.generate-web-container-keys]
description = "Generate a fresh ed25519 keypair for the web-container publish pipeline"
script_runner = "bash"
script = '''
set -euo pipefail
KEY_FILE="${CARGO_MAKE_WORKING_DIRECTORY}/test-contract/web-container-keys.toml"
if [ -f "$KEY_FILE" ]; then
    echo "$KEY_FILE already exists; remove it first to rotate the test key"
    exit 1
fi
cargo run --quiet -p web-container-sign -- generate --output "$KEY_FILE"
'''

[tasks.build-contracts]
description = "Rebuild all contracts/delegates from source into their build/ dirs (the UI embeds the frozen published-contract/wasm/v1/ copies, not these)"
dependencies = [
    "build-inbox-contract",
    "build-token-allocation-record",
    "build-token-generator",
    "build-identity-management-delegate",
    "build-mail-local-state-delegate",
    "generate-identity-params",
    "generate-mail-local-state-params",
]

# ─── Web container, UI, dev ────────────────────────────────────────────────────

[tasks.build-web-container]
description = "Rebuild the web container contract from source (never published: the published wasm is the frozen published-contract/web_container_contract.wasm)"
# Outside the workspace with its own Cargo.lock; run from its directory so
# contracts/.cargo/config.toml applies.
cwd = "./contracts/web-container"
command = "cargo"
args = ["build", "--profile", "${BUILD_PROFILE}", "--target", "${CONTRACT_TARGET}"]

# ─── Container contract (issue #200, Phase 1) ─────────────────────────────────
# The container contract has a STABLE contract id by design. Its wasm + parameters
# never change between releases — only its state's `current_app_id` pointer
# does. See contracts/facade/src/lib.rs and contracts/facade-loader/README.md.

[tasks.build-container-loader]
description = "Render the container loader HTML with a baked CURRENT_APP_ID (defaults to the committed test app id)"
script_runner = "bash"
script = '''
set -euo pipefail
ROOT="${CARGO_MAKE_WORKING_DIRECTORY}"
APP_ID="${FACADE_CURRENT_APP_ID:-}"
if [ -z "$APP_ID" ]; then
    if [ ! -f "$ROOT/published-contract/contract-id.txt" ]; then
        echo "error: FACADE_CURRENT_APP_ID unset and published-contract/contract-id.txt missing" >&2
        echo "       restore it with \`git checkout -- published-contract/\` or set FACADE_CURRENT_APP_ID" >&2
        exit 1
    fi
    APP_ID=$(cat "$ROOT/published-contract/contract-id.txt")
fi
bash "$ROOT/scripts/build-loader.sh" "$APP_ID"
'''

[tasks.build-container]
description = "Build the container contract WASM with its pinned toolchain (contracts/facade, own Cargo.lock, issue #198)"
dependencies = ["build-container-loader"]
script_runner = "bash"
script = '''
set -euo pipefail
ROOT="${CARGO_MAKE_WORKING_DIRECTORY}"
# The container contract's own manifest, lockfile and target/, and its own
# rustc: cargo make exports the root toolchain as RUSTUP_TOOLCHAIN, which
# would win over contracts/facade/rust-toolchain.toml.
cd "$ROOT/contracts/facade"
. "$ROOT/scripts/container-toolchain.sh"
cargo build --profile "${BUILD_PROFILE}" --target "${CONTRACT_TARGET}"
'''

[tasks.pack-container-loader]
description = "Pack the rendered container loader (dist/index.html) into a tar.xz blob the freenet-core gateway can serve as a webapp."
dependencies = ["build-container-loader"]
script_runner = "bash"
script = '''
set -euo pipefail
ROOT="${CARGO_MAKE_WORKING_DIRECTORY}"
APP_ID="${FACADE_CURRENT_APP_ID:-$(cat "$ROOT/published-contract/contract-id.txt")}"
DIST_DIR="$ROOT/contracts/facade-loader/dist"
LOADER_HTML="$DIST_DIR/index.html"
if [ ! -f "$LOADER_HTML" ]; then
    echo "error: $LOADER_HTML missing (build-container-loader should have produced it)" >&2
    exit 1
fi
# Sanity: the rendered HTML MUST embed the current_app_id we're about
# to sign over, otherwise the container pointer redirects users to a
# different app than the loader actually fetches.
if ! grep -q "$APP_ID" "$LOADER_HTML"; then
    echo "error: $LOADER_HTML does not embed current_app_id '$APP_ID'." >&2
    echo "       Re-render with: FACADE_CURRENT_APP_ID=$APP_ID cargo make build-container-loader" >&2
    exit 1
fi
mkdir -p "$ROOT/target/container"
# Use GNU tar for reproducibility (matches compress-webapp). The
# gateway's WebApp::try_from runs XzDecoder → tar.unpack over these
# bytes, so the archive must be a real tar+xz containing index.html.
if command -v gtar >/dev/null 2>&1; then
    TAR=gtar
elif tar --version 2>/dev/null | grep -qi 'gnu tar'; then
    TAR=tar
else
    echo "warning: GNU tar not found — container loader archive will not be" >&2
    echo "         byte-identical across machines (signing is per-build" >&2
    echo "         anyway so this only affects diff noise)." >&2
    TAR=""
fi
OUT="$ROOT/target/container/loader.tar.xz"
if [ -n "$TAR" ]; then
    "$TAR" --sort=name \
        --mtime='2024-01-01 00:00:00 UTC' \
        --owner=0 --group=0 --numeric-owner \
        -C "$DIST_DIR" \
        -cJf "$OUT" index.html
else
    tar -C "$DIST_DIR" -cJf "$OUT" index.html
fi
echo "wrote $OUT ($(wc -c < "$OUT") bytes)"
'''

[tasks.sign-container-state-test]
description = "Sign a container state blob using the committed test key (current_app_id from published-contract)"
script_runner = "bash"
script = '''
set -euo pipefail
ROOT="${CARGO_MAKE_WORKING_DIRECTORY}"
KEY_FILE="$ROOT/test-contract/web-container-keys.toml"
if [ ! -f "$KEY_FILE" ]; then
    echo "error: $KEY_FILE not found — run \`cargo make generate-web-container-keys\`" >&2
    exit 1
fi
# The sandbox container points at the SANDBOX webapp (the test-key id that
# derive-test-contract-id writes), never at the production one.
APP_ID="${FACADE_CURRENT_APP_ID:-}"
if [ -z "$APP_ID" ]; then
    if [ ! -s "$ROOT/target/webapp/contract-id.txt" ]; then
        echo "error: no sandbox webapp id: run \`cargo make derive-test-contract-id\` first," >&2
        echo "       or set FACADE_CURRENT_APP_ID" >&2
        exit 1
    fi
    APP_ID=$(tr -d '[:space:]' < "$ROOT/target/webapp/contract-id.txt")
fi
# Render and pack the loader with that id (the shared loader tasks default to
# the production id).
FACADE_CURRENT_APP_ID="$APP_ID" cargo make pack-container-loader
LOADER="$ROOT/target/container/loader.tar.xz"
if [ ! -f "$LOADER" ]; then
    echo "error: $LOADER missing (pack-container-loader should have produced it)" >&2
    exit 1
fi
mkdir -p "$ROOT/target/container"
version=$(date -u +%s)
cargo run --quiet -p web-container-sign -- sign-facade-state \
    --loader "$LOADER" \
    --current-app-id "$APP_ID" \
    --version "$version" \
    --key-file "$KEY_FILE" \
    --output     "$ROOT/target/container/container.state" \
    --parameters "$ROOT/target/container/container.parameters"
echo "test container state signed at version $version pointing at $APP_ID"
'''

[tasks.sign-container-state]
description = "Sign a container state blob using the PRODUCTION key (current_app_id from published-contract)"
dependencies = ["pack-container-loader"]
script_runner = "bash"
script = '''
set -euo pipefail
ROOT="${CARGO_MAKE_WORKING_DIRECTORY}"
KEY_FILE="${WEB_CONTAINER_KEY_FILE:-$HOME/.config/freenet-email/web-container-keys.toml}"
if [ ! -f "$KEY_FILE" ]; then
    echo "error: production key file not found at $KEY_FILE" >&2
    echo "       generate one out of band with scripts/generate-production-key.sh" >&2
    exit 1
fi
APP_ID="${FACADE_CURRENT_APP_ID:-$(cat "$ROOT/published-contract/contract-id.txt")}"
LOADER="$ROOT/target/container/loader.tar.xz"
if [ ! -f "$LOADER" ]; then
    echo "error: $LOADER missing (pack-container-loader should have produced it)" >&2
    exit 1
fi
mkdir -p "$ROOT/target/container"
version=$(date -u +%s)
cargo run --quiet -p web-container-sign -- sign-facade-state \
    --loader "$LOADER" \
    --current-app-id "$APP_ID" \
    --version "$version" \
    --key-file "$KEY_FILE" \
    --output     "$ROOT/target/container/container.state" \
    --parameters "$ROOT/target/container/container.parameters"
echo "production container state signed at version $version pointing at $APP_ID"
'''

[tasks.update-published-container]
description = "Derive the SANDBOX container contract id (frozen container.wasm + test-key parameters) into target/container/container-id.txt; never writes published-contract/"
dependencies = ["sign-container-state-test"]
script_runner = "bash"
script = '''
set -euo pipefail
ROOT="${CARGO_MAKE_WORKING_DIRECTORY}"
# The same wasm publish-container-test publishes: the frozen one.
WASM="$ROOT/published-contract/container.wasm"
PARAMS="$ROOT/target/container/container.parameters"
[ -s "$WASM" ] || { echo "error: $WASM missing; restore it with git checkout -- published-contract/" >&2; exit 1; }
[ -s "$PARAMS" ] || { echo "error: $PARAMS missing (did sign-container-state-test run?)" >&2; exit 1; }
contract_id=$(CARGO_TARGET_DIR="$ROOT/target" fdev get-contract-id \
    --code "$WASM" --parameters "$PARAMS")
[ -n "$contract_id" ] || { echo "error: fdev get-contract-id returned an empty id" >&2; exit 1; }
printf '%s\n' "$contract_id" > "$ROOT/target/container/container-id.txt"
echo "sandbox container contract id: $contract_id (target/container/container-id.txt)"
'''

[tasks.publish-container-test]
description = "Publish (PUT) the container contract to the local sandbox node — first-time publish only"
dependencies = ["update-published-container"]
script_runner = "bash"
script = '''
set -euo pipefail
ROOT="${CARGO_MAKE_WORKING_DIRECTORY}"
# The frozen container wasm with the test key's parameters, which signed
# the state (the committed parameters are the production key's).
WASM="$ROOT/published-contract/container.wasm"
PARAMS="$ROOT/target/container/container.parameters"
STATE="$ROOT/target/container/container.state"
if [ ! -f "$WASM" ]; then
    echo "error: $WASM missing; restore it with git checkout -- published-contract/" >&2
    exit 1
fi
if [ ! -f "$PARAMS" ]; then
    echo "error: $PARAMS missing (did sign-container-state-test run?)" >&2
    exit 1
fi
PORT="${FREENET_LOCAL_PORT:-7509}"
fdev --port "$PORT" publish \
    --code "$WASM" \
    --parameters "$PARAMS" \
    contract \
    --state "$STATE"
'''

[tasks.publish-container]
description = "Publish (PUT) the container contract to the live Freenet network — ONE-TIME prod publish only"
dependencies = ["check-release-freeze", "build-container", "sign-container-state"]
script_runner = "bash"
script = '''
set -euo pipefail
ROOT="${CARGO_MAKE_WORKING_DIRECTORY}"
WASM="$ROOT/published-contract/container.wasm"
PARAMS="$ROOT/published-contract/container.parameters"
STATE="$ROOT/target/container/container.state"
if [ ! -f "$WASM" ] || [ ! -f "$PARAMS" ]; then
    echo "error: container wasm/parameters missing; restore them with git checkout -- published-contract/" >&2
    exit 1
fi
if [ ! -f "$STATE" ]; then
    echo "error: $STATE missing — sign-container-state dependency should have produced it" >&2
    exit 1
fi
# IMPORTANT: this is a one-shot. The container contract id MUST stay
# byte-stable forever (it's the bookmarkable URL); re-PUTting it on a
# network that already has the contract is wasteful but harmless.
# Per-release pointer flips use `fdev execute update --as-state`
# inside scripts/release.sh, NOT this task.
echo "publishing container contract $(cat "$ROOT/published-contract/container-id.txt") to the live network"
echo "  (no --port: targets whichever node owns 7509)"
fdev publish \
    --code "$WASM" \
    --parameters "$PARAMS" \
    contract \
    --state "$STATE"
'''

[tasks.check-container-byte-equal]
description = "Verify the freshly built container wasm matches the committed published-contract/container.wasm"
script_runner = "bash"
script = '''
"${CARGO_MAKE_WORKING_DIRECTORY}/scripts/check-container-byte-equal.sh"
'''

[tasks.update-container-state-test]
description = "UPDATE the container contract state on the local sandbox (per-release pointer flip)"
dependencies = ["update-published-container"]
script_runner = "bash"
script = '''
set -euo pipefail
ROOT="${CARGO_MAKE_WORKING_DIRECTORY}"
PORT="${FREENET_LOCAL_PORT:-7509}"
# The sandbox container (derived by update-published-container), not the
# production one.
FACADE_ID=$(cat "$ROOT/target/container/container-id.txt")
STATE="$ROOT/target/container/container.state"
echo "UPDATEing container state at $FACADE_ID (port $PORT)"
# --as-state: the container contract's `update_state` accepts only
# UpdateData::State; without it fdev sends a Delta, which it rejects.
fdev --port "$PORT" execute update --as-state "$FACADE_ID" "$STATE"
'''

# Aliases of the container tasks, under their earlier "facade" names.
[tasks.build-facade-loader]
dependencies = ["build-container-loader"]
[tasks.build-facade]
dependencies = ["build-container"]
[tasks.pack-facade-loader]
dependencies = ["pack-container-loader"]
[tasks.sign-facade-state-test]
dependencies = ["sign-container-state-test"]
[tasks.sign-facade-state]
dependencies = ["sign-container-state"]
[tasks.update-published-facade]
dependencies = ["update-published-container"]
[tasks.publish-facade-test]
dependencies = ["publish-container-test"]
[tasks.publish-facade]
dependencies = ["publish-container"]
[tasks.check-facade-byte-equal]
dependencies = ["check-container-byte-equal"]
[tasks.update-facade-state-test]
dependencies = ["update-container-state-test"]

[tasks.build-ui]
description = "Build the Dioxus UI (embeds the frozen published-contract/wasm/v1/ artifacts)"
command = "dx"
args = ["build", "--${BUILD_PROFILE}", "--features", "use-node"]
cwd = "./ui"

[tasks.build]
description = "Full release build (the UI; contract and container WASM are frozen, committed artifacts)"
dependencies = ["build-ui"]

[tasks.dev]
description = "Local Dioxus dev server"
command = "dx"
args = ["serve", "--features", "use-node"]
cwd = "./ui"

[tasks.dev-example]
description = "Local dev server with example data, no node sync (offline)"
# Offline build: needs none of the committed contract artifacts.
command = "dx"
args = ["serve", "--features", "example-data,no-sync", "--no-default-features"]
cwd = "./ui"

[tasks.build-ui-example-no-sync]
description = "Release build of the UI in offline mode (for CI/Playwright)"
command = "dx"
args = [
    "build",
    "--${BUILD_PROFILE}",
    "--features", "example-data,no-sync",
    "--no-default-features",
]
cwd = "./ui"

# ─── Publish pipeline (see AGENTS.md §Publishing) ─────────────────────────────
#
# The flow, in order:
#
#   build-ui  →  compress-webapp  →  sign-webapp{,-test}  →  \
#                verify-published-contract | derive-test-contract-id  →  \
#                publish-email{,-test}
#
# `publish-all` wires the test variant end-to-end for local validation.
#
# The webapp contract WASM is FROZEN: every publish uses the committed
# published-contract/web_container_contract.wasm, never a rebuild, so the
# production webapp contract id (hash(wasm, parameters)) never changes. Only the
# signed webapp state changes per release. Nothing in this pipeline writes
# to published-contract/: the production flow verifies it, and the test
# flow derives its own id into target/webapp/.
#
# `publish-email-test` uses the committed key at
# `test-contract/web-container-keys.toml` so two developers building from
# the same commit derive a byte-identical contract ID.
#
# `publish-email` (production) uses an uncommitted key at
# `~/.config/freenet-email/web-container-keys.toml`. Override with
# `WEB_CONTAINER_KEY_FILE=/path/to/keys.toml cargo make publish-email`.

[tasks.compress-webapp]
description = "Compress the built webapp into target/webapp/webapp.tar.xz"
dependencies = ["build-ui"]
script_runner = "bash"
script = '''
set -euo pipefail
ROOT="${CARGO_MAKE_WORKING_DIRECTORY}"
# `dx` keys its output dir on the binary name (ui/Cargo.toml has
# `default-run = "app"`), not the package name.
DX_OUT="$ROOT/target/dx/app/release/web/public"
if [ ! -d "$DX_OUT" ]; then
    echo "error: dx build output not found at $DX_OUT" >&2
    echo "       (did \`cargo make build-ui\` succeed?)" >&2
    exit 1
fi
mkdir -p "$ROOT/target/webapp"
# Reproducibility: --sort=name, fixed --mtime, and --owner/--group=0
# are required for byte-identical archives across machines. GNU tar
# supports these flags; BSD tar (macOS default) does not. On macOS,
# install `gnu-tar` (`brew install gnu-tar`) to get a `gtar` binary.
# Without GNU tar the archive still signs and publishes, but two
# developers on two machines will derive different contract IDs,
# which defeats the committed-published-contract reproducibility
# goal. We warn loudly in that case.
if command -v gtar >/dev/null 2>&1; then
    TAR=gtar
elif tar --version 2>/dev/null | grep -qi 'gnu tar'; then
    TAR=tar
else
    echo "warning: GNU tar not found — the resulting archive will NOT be" >&2
    echo "         byte-identical across machines. Install gnu-tar for" >&2
    echo "         reproducible builds (macOS: \`brew install gnu-tar\`)." >&2
    TAR=""
fi
if [ -n "$TAR" ]; then
    "$TAR" --sort=name \
        --mtime='2024-01-01 00:00:00 UTC' \
        --owner=0 --group=0 --numeric-owner \
        -C "$DX_OUT" \
        -cJf "$ROOT/target/webapp/webapp.tar.xz" .
else
    tar -C "$DX_OUT" -cJf "$ROOT/target/webapp/webapp.tar.xz" .
fi
echo "wrote $ROOT/target/webapp/webapp.tar.xz ($(wc -c < "$ROOT/target/webapp/webapp.tar.xz") bytes)"
'''

[tasks.sign-webapp-test]
description = "Sign the compressed webapp with the committed test keypair"
dependencies = ["compress-webapp"]
script_runner = "bash"
script = '''
set -euo pipefail
ROOT="${CARGO_MAKE_WORKING_DIRECTORY}"
KEY_FILE="$ROOT/test-contract/web-container-keys.toml"
if [ ! -f "$KEY_FILE" ]; then
    echo "error: $KEY_FILE not found" >&2
    echo "       run \`cargo make generate-web-container-keys\` first" >&2
    exit 1
fi
# Monotonic version: unix timestamp (seconds). The on-chain
# web-container update check requires strictly increasing versions;
# the prior commit-hash-to-u32 scheme was not monotonic and broke at
# v0.1.1 (a newer commit happened to hash lower than the deployed
# state). Timestamp is the simplest source that's always monotonic
# without coordination.
#
# The version lives in the signed metadata (contract state), not in the
# parameters, so it never affects the contract id.
version=$(date -u +%s)
echo "signing with version $version (unix timestamp)"
cargo run --quiet -p web-container-sign -- sign \
    --input "$ROOT/target/webapp/webapp.tar.xz" \
    --output "$ROOT/target/webapp/webapp.metadata" \
    --parameters "$ROOT/target/webapp/webapp.parameters" \
    --version "$version" \
    --key-file "$KEY_FILE"
'''

[tasks.sign-webapp]
description = "Sign the compressed webapp with the production keypair"
dependencies = ["compress-webapp"]
script_runner = "bash"
script = '''
set -euo pipefail
ROOT="${CARGO_MAKE_WORKING_DIRECTORY}"
KEY_FILE="${WEB_CONTAINER_KEY_FILE:-$HOME/.config/freenet-email/web-container-keys.toml}"
if [ ! -f "$KEY_FILE" ]; then
    echo "error: production key file not found at $KEY_FILE" >&2
    echo "" >&2
    echo "generate one out of band with:" >&2
    echo "  scripts/generate-production-key.sh" >&2
    echo "" >&2
    echo "or override the location:" >&2
    echo "  WEB_CONTAINER_KEY_FILE=/path/to/keys.toml cargo make publish-email" >&2
    exit 1
fi
# Monotonic version: unix timestamp (seconds). See sign-webapp-test
# for the rationale — short version: the on-chain update check needs
# strict monotonicity, the prior commit-hash scheme didn't provide it.
version=$(date -u +%s)
echo "signing with production key at $KEY_FILE, version $version (unix timestamp)"
cargo run --quiet -p web-container-sign -- sign \
    --input "$ROOT/target/webapp/webapp.tar.xz" \
    --output "$ROOT/target/webapp/webapp.metadata" \
    --parameters "$ROOT/target/webapp/webapp.parameters" \
    --version "$version" \
    --key-file "$KEY_FILE"
'''

[tasks.derive-test-contract-id]
description = "Derive the TEST webapp contract id (frozen webapp contract wasm + test-key parameters) into target/webapp/contract-id.txt"
dependencies = ["sign-webapp-test"]
script_runner = "bash"
script = '''
set -euo pipefail
ROOT="${CARGO_MAKE_WORKING_DIRECTORY}"
WASM="$ROOT/published-contract/web_container_contract.wasm"
PARAMS="$ROOT/target/webapp/webapp.parameters"
[ -s "$WASM" ] || { echo "error: $WASM missing; restore it with git checkout -- published-contract/" >&2; exit 1; }
[ -s "$PARAMS" ] || { echo "error: $PARAMS not found (did sign-webapp-test run?)" >&2; exit 1; }
# hash(wasm, parameters): the frozen wasm with the committed test key's
# parameters. Written under target/, never over the committed production
# snapshot in published-contract/.
contract_id=$(CARGO_TARGET_DIR="$ROOT/target" fdev get-contract-id \
    --code "$WASM" --parameters "$PARAMS")
[ -n "$contract_id" ] || { echo "error: fdev get-contract-id returned an empty id" >&2; exit 1; }
printf '%s\n' "$contract_id" > "$ROOT/target/webapp/contract-id.txt"
echo "test contract id: $contract_id (target/webapp/contract-id.txt)"
'''

[tasks.update-published-contract]
description = "Alias of derive-test-contract-id"
dependencies = ["derive-test-contract-id"]
script = '''
echo "update-published-contract is an alias of derive-test-contract-id: it derives the test id into target/webapp/contract-id.txt and leaves published-contract/ untouched."
'''

[tasks.verify-published-contract]
description = "Check the PRODUCTION signing key matches the committed snapshot: same parameters, same derived contract id"
dependencies = ["sign-webapp"]
script_runner = "bash"
script = '''
set -euo pipefail
ROOT="${CARGO_MAKE_WORKING_DIRECTORY}"
WASM="$ROOT/published-contract/web_container_contract.wasm"
COMMITTED_PARAMS="$ROOT/published-contract/webapp.parameters"
SIGNED_PARAMS="$ROOT/target/webapp/webapp.parameters"
for f in "$WASM" "$COMMITTED_PARAMS" "$ROOT/published-contract/contract-id.txt"; do
    [ -s "$f" ] || { echo "error: $f missing; restore it with git checkout -- published-contract/" >&2; exit 1; }
done
[ -s "$SIGNED_PARAMS" ] || { echo "error: $SIGNED_PARAMS not found (did sign-webapp run?)" >&2; exit 1; }
# The parameters are the signer's verifying key. A webapp signed with any
# other key is rejected by the published contract.
if ! cmp -s "$SIGNED_PARAMS" "$COMMITTED_PARAMS"; then
    echo "error: the signing key does not match published-contract/webapp.parameters" >&2
    echo "       (signed with: ${WEB_CONTAINER_KEY_FILE:-$HOME/.config/freenet-email/web-container-keys.toml})" >&2
    exit 1
fi
# The production webapp contract id. Users' bookmarks resolve through it;
# it never changes.
pinned="GeQLXXR8sfGe31BNRJoVxkvGUTnBkufJ4gTaoX5NWnU5"
expected=$(tr -d '[:space:]' < "$ROOT/published-contract/contract-id.txt")
derived=$(CARGO_TARGET_DIR="$ROOT/target" fdev get-contract-id \
    --code "$WASM" --parameters "$COMMITTED_PARAMS")
if [ "$derived" != "$pinned" ] || [ "$expected" != "$pinned" ]; then
    echo "error: published-contract/ does not give the production webapp contract id $pinned:" >&2
    echo "       wasm + parameters give $derived, contract-id.txt says $expected." >&2
    echo "       Restore it with git checkout -- published-contract/" >&2
    exit 1
fi
echo "production webapp contract id: $pinned (frozen wasm, signing key matches)"
'''

[tasks.update-published-contract-prod]
description = "Alias of verify-published-contract"
dependencies = ["verify-published-contract"]
script = '''
echo "update-published-contract-prod is an alias of verify-published-contract: it checks the production key and the committed snapshot, and leaves published-contract/ untouched."
'''

[tasks.publish-email-test]
description = "Publish the test build of the webapp to a local Freenet node"
dependencies = ["sign-webapp-test", "derive-test-contract-id"]
script_runner = "bash"
script = '''
set -euo pipefail
ROOT="${CARGO_MAKE_WORKING_DIRECTORY}"
contract_id=$(cat "$ROOT/target/webapp/contract-id.txt")
echo "publishing with test contract id $contract_id"
# The frozen webapp contract wasm with the test key's parameters.
# `--port` honours FREENET_LOCAL_PORT so we publish to the same isolated
# node `run-node` started — otherwise fdev defaults to 7509 and publishes
# to whatever node owns it, which may be a sibling worktree.
PORT="${FREENET_LOCAL_PORT:-7509}"
fdev --port "$PORT" publish \
    --code "$ROOT/published-contract/web_container_contract.wasm" \
    --parameters "$ROOT/target/webapp/webapp.parameters" \
    contract \
    --webapp-archive "$ROOT/target/webapp/webapp.tar.xz" \
    --webapp-metadata "$ROOT/target/webapp/webapp.metadata"
'''

[tasks.publish-email-iso]
description = "Publish the test webapp to the isolated 2-node gateway (port 7510)"
dependencies = ["sign-webapp-test", "derive-test-contract-id"]
script_runner = "bash"
script = '''
set -euo pipefail
ROOT="${CARGO_MAKE_WORKING_DIRECTORY}"
PORT="${FREENET_ISO_GW_PORT:-7510}"
contract_id=$(cat "$ROOT/target/webapp/contract-id.txt")
echo "publishing with test contract id $contract_id to iso gateway :$PORT"
fdev --port "$PORT" publish \
    --code "$ROOT/published-contract/web_container_contract.wasm" \
    --parameters "$ROOT/target/webapp/webapp.parameters" \
    contract \
    --webapp-archive "$ROOT/target/webapp/webapp.tar.xz" \
    --webapp-metadata "$ROOT/target/webapp/webapp.metadata"
'''

[tasks.check-release-freeze]
description = "Refuse while .release-freeze exists (first step of every production publish)"
script_runner = "bash"
script = '''
"${CARGO_MAKE_WORKING_DIRECTORY}/scripts/check-release-freeze.sh"
'''

[tasks.publish-email]
description = "Publish the production build of the webapp to Freenet"
dependencies = ["check-release-freeze", "sign-webapp", "verify-published-contract"]
script_runner = "bash"
script = '''
set -euo pipefail
ROOT="${CARGO_MAKE_WORKING_DIRECTORY}"
contract_id=$(tr -d '[:space:]' < "$ROOT/published-contract/contract-id.txt")
echo "publishing with production contract id $contract_id"
fdev publish \
    --code "$ROOT/published-contract/web_container_contract.wasm" \
    --parameters "$ROOT/published-contract/webapp.parameters" \
