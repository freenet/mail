[package]
name = "freenet-email-ui"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false
default-run = "app"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "app"

[dependencies]
bs58 = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, features = ["clock", "wasmbind"] }
dioxus = { workspace = true, features = ["web"] }
futures = "0.3.34"
getrandom = { workspace = true }
ml-dsa = { workspace = true }
ml-kem = { workspace = true }
chacha20poly1305 = "0.11.0"
hkdf = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4.79"
gloo-timers = { version = "0.4.0", features = ["futures"] }

freenet-mail-wire-v1 = { workspace = true, features = ["clock"] }
freenet-mail-protocol = { workspace = true }
# The real mail delegate, run in-page for the offline build (no node). Never
# linked into a `use-node` build: the node runs the published WASM. Built
# with `v1-transition`, as the candidate the node build embeds is, so the
# offline build answers `V1AftParams` the same way.
mail-delegate = { path = "../delegates/mail-delegate", optional = true, features = ["v1-transition"] }
serde_bytes = "0.11.19"
ciborium = "0.2.2"
zeroize = "1.8.2"
freenet-stdlib = { workspace = true, features = ["net"] }
uuid = { version = "1.29.0", features = ["v4", "js"] }

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
serde-wasm-bindgen = "0.6.5"

[target.'cfg(target_family = "wasm")'.dependencies.web-sys]
version = "0.3.106"
features = [
    "BeforeUnloadEvent",
    "BinaryType",
    "Blob",
    "BlobPropertyBag",
    "Clipboard",
    "console",
    "Document",
    "Element",
    "ErrorEvent",
    "File",
    "FileList",
    "FileReader",
    "Headers",
    "HtmlAnchorElement",
    "HtmlDocument",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "InputEvent",
    "Navigator",
    "Performance",
    "Request",
    "RequestInit",
    "Response",
    "Url",
    "WebSocket",
    "Window",
]

[features]
default = ["use-node"]
# Seed the UI with mock identities and mock messages so it renders without
# any real Freenet state. Combine with `no-sync` for a fully offline build:
#   cargo make dev-example
example-data = ["local-delegate"]
# Skip the local-node WebSocket entirely. Orthogonal to `example-data` —
# enabling `no-sync` alone produces an empty UI; pair with `example-data`
# (and `--no-default-features`) for the offline dev loop.
no-sync = ["local-delegate"]
# Run the mail delegate in the page instead of on a node (offline builds).
local-delegate = ["dep:mail-delegate"]
use-node = []

[build-dependencies]
# Validates the repo-root legacy_*.toml registries and generates their consts.
freenet-migrate-build = "0.2.0"
