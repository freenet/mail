[toolchain]
# Latest stable for the workspace and the out-of-workspace contract crates.
# Nothing published is rebuilt with it: the contract and delegate WASM the UI
# embeds are frozen under published-contract/wasm/, and a new generation is
# built deliberately with scripts/build-wasm.sh.
#
# The one exception is the container contract, whose bytes are its stable
# URL: it keeps its own pin in contracts/facade/rust-toolchain.toml.
#
# Keep the `dtolnay/rust-toolchain@<version>` refs in .github/workflows/ in
# step with this file; Dependabot is told to ignore that action.
channel = "1.99.1"
targets = ["wasm32-unknown-unknown"]
components = ["rustfmt", "clippy"]
